# AndroidX is required by every dependency this project uses (car.app, room,
# compose, lifecycle). Without this the build fails at :app:checkDebugAarMetadata.
android.useAndroidX=true

# Kotlin code style for the Kotlin Gradle plugin
kotlin.code.style=official

# Only package the resources actually referenced, per build type.
android.nonTransitiveRClass=true

# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
